name: CI

# Required status check for main. PRs auto-merge (squash) once this passes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Start game server (integration tests use port 3001)
        run: |
          (cd server && nohup ../node_modules/.bin/tsx index.ts > ../server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3001; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; cat server.log; exit 1

      - name: Tests
        run: pnpm exec vitest run --testTimeout=20000
